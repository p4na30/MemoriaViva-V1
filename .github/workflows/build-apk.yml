name: Build MemoriaViva RISE Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS Cloud Run URL for Demo APK (overrides vars.APP_SERVER_URL)"
        required: false
        default: ""
      clean_server_url:
        description: "HTTPS Cloud Run URL for Clean Production APK (overrides vars.APP_CLEAN_SERVER_URL)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: demo
            app_id: org.memoriaviva.rise.demo
            app_name: "MemoriaViva Demo"
            apk_filename: memoriaviva-demo.apk
          - variant: clean
            app_id: org.memoriaviva.rise
            app_name: "MemoriaViva RISE"
            apk_filename: memoriaviva-clean.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Capacitor variant (${{ matrix.variant }})
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.appId = process.env.CAP_APP_ID;
            cfg.appName = process.env.CAP_APP_NAME;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2) + "\n");
          '
        env:
          CAP_APP_ID: ${{ matrix.app_id }}
          CAP_APP_NAME: ${{ matrix.app_name }}

      - name: Install frontend dependencies & build React bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ matrix.variant == 'clean' && (github.event.inputs.clean_server_url || vars.APP_CLEAN_SERVER_URL || github.event.inputs.server_url || vars.APP_SERVER_URL || '') || (github.event.inputs.server_url || vars.APP_SERVER_URL || '') }}
        run: |
          npm ci
          npm run build

      - name: Generate and configure Capacitor 6 Android project
        working-directory: frontend
        run: |
          npx cap add android
          node scripts/configure-android.mjs
          npx cap sync android

      - name: Build Debug APK (${{ matrix.apk_filename }})
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../../release-apks
          cp app/build/outputs/apk/debug/app-debug.apk "../../release-apks/${{ matrix.apk_filename }}"

      - name: Upload APK Artifact (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: memoriaviva-${{ matrix.variant }}-apk
          path: frontend/release-apks/${{ matrix.apk_filename }}
          retention-days: 14

      - name: Decode Keystore and Build Signed Release APK (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: /tmp/memoriaviva-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../../release-apks/signed-${{ matrix.apk_filename }}"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; skipping signed release APK (debug APK will still be attached)."
          fi

      - name: Publish APKs to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/release-apks/${{ matrix.apk_filename }}
            frontend/release-apks/signed-${{ matrix.apk_filename }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
